<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Real-time OSINT globe: flights, earthquakes, disaster alerts, satellites and public webcams with a rule-based alert engine.">
<meta name="theme-color" content="#03050a">
<!-- Scripts only from this site and the pinned CDN; no inline script, no plugins, no form posts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Global Monitor</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<canvas id="globe"></canvas>

<button class="btn mobile-toggle" id="toggleLeft">Controls</button>
<button class="btn mobile-toggle" id="toggleRight">Feed</button>

<aside id="left" class="panel">
  <button class="grabber" data-close-sheet aria-label="Close panel"></button>
  <header class="panel-head">
    <div class="brand">Global Monitor<span class="demo-pill" id="demoPill" hidden>DEMO</span></div>
    <div class="head-right">
      <button class="btn" id="modeBtn" title="Toggle demo data">Demo</button>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <span class="indicator" id="tabIndicator"></span>
    <button data-tab="sources" class="active">Sources</button>
    <button data-tab="rules">Rules</button>
    <button data-tab="zones">Zones</button>
  </nav>
  <div class="tab-host">
    <section id="tab-sources" class="tab active"><div id="sourcesList"></div><div id="keyBox"></div></section>
    <section id="tab-rules" class="tab"></section>
    <section id="tab-zones" class="tab"></section>
  </div>
</aside>

<aside id="right" class="panel">
  <button class="grabber" data-close-sheet aria-label="Close panel"></button>
  <header class="panel-head">
    <div class="brand" id="feedTitle">Events<span id="unread" class="badge zero">0</span></div>
    <div class="actions">
      <button class="btn" id="btnNotify">Notify off</button>
      <button class="btn" id="btnExport">Export</button>
      <button class="btn" id="btnClear">Clear</button>
    </div>
  </header>
  <div class="filters">
    <select id="sevFilter">
      <option value="low">All</option>
      <option value="medium">Medium+</option>
      <option value="high">High+</option>
      <option value="critical">Critical</option>
    </select>
    <label>Hide baseline <input type="checkbox" id="hideBaseline" checked></label>
  </div>
  <div class="detail-wrap" id="detailWrap"><div class="detail-inner"><div id="detail"></div></div></div>
  <div id="feed"></div>
</aside>

<div id="toasts"></div>

<!-- Exact npm builds, pinned by version and verified by Subresource Integrity:
     if a CDN file is altered, the browser refuses to run it. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.0/dist/satellite.min.js" integrity="sha384-MIBG+Y34qqectgEd35uAWHjNhqFaVGYfrgccleIhIQLWHcihnkwwAeLF7fB0kWWk" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="src/app.js"></script>
</body>
</html>
