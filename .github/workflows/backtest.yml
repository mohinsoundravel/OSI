name: Backtest
on:
  push:
    branches: [backtest]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        run: git clone -q --depth 1 --branch backtest "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Run
        env:
          MONITOR_CONFIG_JSON: ${{ secrets.MONITOR_CONFIG_JSON }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          node "backtest/$(cat backtest/ENTRY)" "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/out/log.txt"
      - name: Publish results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b backtest-results
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "backtest ${GITHUB_RUN_ID}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/backtest-results
